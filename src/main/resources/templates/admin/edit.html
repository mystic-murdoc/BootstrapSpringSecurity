<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<form th:action="@{'/admin/users/' + ${user.id} + '/edit'}" method="post">

    <div class="mb-2">
        <label class="form-label" for="name">Name</label>
        <input id="name" class="form-control" type="text" name="name" th:value="${user.name}">
    </div>

    <div class="mb-2">
        <label class="form-label" for="age">Age</label>
        <input id="age" class="form-control" type="number" name="age" th:value="${user.age}">
    </div>

    <div class="mb-2">
        <label for="username" class="form-label">Username</label>
        <input id="username" class="form-control" type="text" name="username" th:value="${user.username}">
    </div>

    <div class="mb-2">
        <label for="password" class="form-label">Password</label>
        <input id="password" class="form-control" type="password" name="password">
    </div>

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}"/>

    <button type="submit" class="btn btn-success">Save</button>

    <div class="mb-2">
        <label for="roleName" class="form-label">Role</label>
        <select id="roleName" class="form-select" name="roleName">
            <option value="ROLE_USER">USER</option>
            <option value="ROLE_ADMIN">ADMIN</option>
        </select>
    </div>
</form>
</body>
</html>
