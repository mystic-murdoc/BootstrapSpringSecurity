<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<h2 class="mb-4">All Users</h2>

<table class="table table-striped table-hover">
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.name}"></td>
        <td th:text="${user.age}"></td>
        <td th:text="${user.username}"></td>

        <td>
            <span th:each="role : ${user.roles}"
                  th:text="${role.authority + ' '}"></span>
        </td>

        <td>
            <a class="btn btn-sm btn-primary"
               th:href="@{'/admin/users/' + ${user.id} + '/edit'}">
                Edit
            </a>

            <form th:action="@{'/admin/users/' + ${user.id} + '/delete'}"
                  method="post"
                  style="display:inline;">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <button type="submit" class="btn btn-sm btn-danger">
                    Delete
                </button>
            </form>
        </td>
    </tr>
</table>

<hr>

<h3>Create user</h3>

<form action="/admin/users" method="post" class="mt-4">

    <div class="mb-2">
        <label class="form-label" for="name">Name</label>
        <input id="name" class="form-control" type="text" name="name">
    </div>

    <div class="mb-2">
        <label class="form-label" for="age">Age</label>
        <input id="age" class="form-control" type="number" name="age">
    </div>

    <div class="mb-2">
        <label for="username" class="form-label">Username</label>
        <input id="username" class="form-control" type="text" name="username">
    </div>

    <div class="mb-2">
        <label for="password" class="form-label">Password</label>
        <input id="password" class="form-control" type="password" name="password">
    </div>

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <button type="submit" class="btn btn-success mt-2">
        Create
    </button>

    <div class="mb-2">
        <label for="roleName" class="form-label">Role</label>
        <select id="roleName" class="form-select" name="roleName">
            <option value="ROLE_USER">USER</option>
            <option value="ROLE_ADMIN">ADMIN</option>
        </select>
    </div>

</form>

</body>
</html>
